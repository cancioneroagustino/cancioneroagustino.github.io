<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proyector de letras - Cancionero Católico</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<link href="/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/cancionero.css">
<style>
:root {
  --bg-color: #ffffff;
  --text-color: #000000;
  --font-size: 6vh;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
}

/* ---------- Pantalla de configuración ---------- */
#configuracion {
  padding: 2rem;
  background-color: var(--bg-color);
  color: var(--text-color);
}
#configuracion .btn {
  color: var(--text-color);
  border-color: var(--text-color);
}
#configuracion .btn:hover:not(:disabled) {
  background-color: var(--text-color);
  color: var(--bg-color);
}
#configuracion .btn:disabled {
  opacity: 0.5;
}
#estado {
  min-height: 1.5rem;
}
button {
  margin: 0.25rem;
}

/* ---------- Pantalla de proyección ---------- */
#pantalla-proyector {
  display: none;
  text-align: center;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 5vh 6vw;
  font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
  /* --ajuste (0.65 a 1) lo calcula el script si una estrofa no cabe */
  font-size: calc(var(--font-size, 6vh) * var(--ajuste, 1));
  line-height: 1.25;
  user-select: none;
  transition: opacity 0.2s ease-in-out;
  opacity: 1;
}
#pantalla-proyector.fade-out {
  opacity: 0 !important;
}

/* Modo por estrofa: una diapositiva a la vez, centrada, navega con clic/teclas */
#pantalla-proyector.modo-estrofa {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  touch-action: manipulation;
}

/* Modo continuo: texto corrido; sólo se desplaza, no responde a clics */
#pantalla-proyector.modo-continuo {
  display: block;
  cursor: default;
  touch-action: pan-y;
}

/* Tipografía interna: todo en em, para que escale con A+ / A− */
.titulo-cancion {
  font-size: 1.3em;
  font-weight: 600;
  line-height: 1.2;
  margin: 0;
}
.modo-continuo .titulo-cancion {
  margin: 1.6em 0 0.8em;
}
.bloque {
  width: 100%;
  font-weight: normal;
}
.modo-continuo .bloque {
  margin: 0 0 1.2em;
}
.bloque-oracion {
  width: 100%;
  font-weight: normal;
  line-height: 1.4;
}
.modo-continuo .bloque-oracion {
  margin: 0 0 0.4em;
}
.estribillo-destacado {
  font-weight: bold;
}

/* ---------- Controles de tamaño ---------- */
#controles-tamano {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 9999;
}
#controles-tamano button {
  display: block;
  margin-bottom: 0.3rem;
  font-size: 0.6rem;
  padding: 0.4rem 0.6rem;
  color: var(--text-color);
  border-color: var(--text-color);
}
</style>
</head>
<body>

<div id="configuracion" class="container text-center">
  <h1>Proyección de letras</h1>

  <div class="mt-4">
    <h5>Presets</h5>
    <button class="btn btn-outline-secondary" data-preset="dia1">Día 1</button>
    <button class="btn btn-outline-secondary" data-preset="dia2">Día 2</button>
    <button class="btn btn-outline-secondary" data-preset="dia3">Día 3</button>
    <button class="btn btn-outline-secondary" data-preset="dia4">Día 4</button>
  </div>
  <div>
    <button class="btn btn-outline-secondary" data-preset="dia5">Día 5</button>
    <button class="btn btn-outline-secondary" data-preset="dia6">Día 6</button>
    <button class="btn btn-outline-secondary" data-preset="dia7">Día 7</button>
    <button class="btn btn-outline-secondary" data-preset="noche">Noche</button>
  </div>

  <div class="mt-4">
    <h5>Colores personalizados</h5>
    <label>Fondo: <input type="color" id="bgColor" value="#ffffff"></label>
    <label class="ms-3">Texto: <input type="color" id="textColor" value="#000000"></label>
  </div>

  <div class="mt-4">
    <button id="btn-continuo" class="btn btn-outline-secondary btn-lg">Proyectar letras continuas</button>
    <button id="btn-estrofa" class="btn btn-outline-secondary btn-lg">Proyectar letras por estrofa</button>
  </div>

  <p id="estado" class="mt-3" role="status"></p>
</div>

<div id="pantalla-proyector"></div>

<div id="controles-tamano">
  <button id="btn-mas" class="btn btn-outline-secondary">A+</button>
  <button id="btn-menos" class="btn btn-outline-secondary">A−</button>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN AJUSTABLE
   ===================================================================== */
// Una estrofa (o estribillo) con más líneas que esto se reparte en varias
// diapositivas, de forma equilibrada (p. ej. 10 líneas -> 5 + 5).
const MAX_LINEAS_POR_SLIDE = 8;

// Tamaño del texto en vh (A+ / A−)
const FONT_MIN = 2;
const FONT_MAX = 14;
const FONT_PASO = 0.5;

// Si una diapositiva igual no cabe (líneas muy largas que se parten),
// el texto se reduce hasta este factor del tamaño elegido, y no más.
const AJUSTE_MIN = 0.65;

const PRESETS = {
  dia1:  ['#ffffff', '#000000'],
  dia2:  ['#f2e6a7', '#1a1a1a'],
  dia3:  ['#dedede', '#1a1a1a'],
  dia4:  ['#dedede', '#7a1121'],
  dia5:  ['#4B1F1F', '#F5F5F2'],
  dia6:  ['#3A2618', '#F5F5F2'],
  dia7:  ['#3A2618', '#D4B15F'],
  noche: ['#000000', '#ffffff']
};

/* =====================================================================
   ESTADO
   ===================================================================== */
const $ = id => document.getElementById(id);
const pantalla = $('pantalla-proyector');

let diapositivas = [];   // lista "lógica": título, estrofas, oraciones, fin
let slides = [];         // lista para el modo por estrofa (con estrofas largas ya divididas)
let indiceActual = 0;
let modo = null;         // null | 'estrofa' | 'continuo'
let cargando = false;
let timerFade = null;
let fontSize = 6;

/* =====================================================================
   UTILIDADES
   ===================================================================== */
function escaparHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Lee el programa guardado. Si no existe o está dañado, devuelve [] en vez de
// romper el script entero. No borra ni modifica lo guardado.
function leerPrograma() {
  try {
    const datos = JSON.parse(localStorage.getItem('programaMisa'));
    return Array.isArray(datos) ? datos : [];
  } catch (err) {
    console.warn('No se pudo leer programaMisa:', err);
    return [];
  }
}

function mostrarEstado(texto) {
  $('estado').textContent = texto || '';
}

function setBotonesProyeccion(habilitados) {
  $('btn-continuo').disabled = !habilitados;
  $('btn-estrofa').disabled = !habilitados;
}

// Detecta líneas de acordes (el sitio no usa dos mayúsculas seguidas en letras)
function isChordLine(line) {
  return /(\bDO|\bRE|\bMI|\bFA|\bSOL|\bLA|\bSI)[b#]?|\bCejillo\b|\bIntro\b/.test(line);
}

/* =====================================================================
   CARGA Y ANÁLISIS DE LAS CANCIONES
   ===================================================================== */
// Devuelve las diapositivas lógicas de una canción. Si algo falla
// (sin red, 404, mal codificada), devuelve [] en silencio.
async function procesarCancion(item) {
  try {
    const res = await fetch(item.cancion);
    if (!res.ok) return [];

    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const titulo = doc.querySelector('title')?.textContent.trim() || 'Sin título';

    const pre = doc.querySelector('pre#letra');

    // Rama de oraciones
    if (!pre) {
      const oracion = doc.querySelector('#oracion');
      if (!oracion) return [];

      const salida = [{ tipo: 'titulo', contenido: titulo }];
      const parrafos = oracion.querySelectorAll('p');
      if (parrafos.length > 0) {
        parrafos.forEach(p => salida.push({ tipo: 'oracion-estrofa', texto: p.innerHTML }));
      } else {
        salida.push({ tipo: 'oracion-estrofa', texto: oracion.innerHTML });
      }
      return salida;
    }

    // Rama de canciones: separar estrofas y estribillos
    const lineas = pre.innerHTML.split('\n');
    let bloques = [];
    let bloqueActual = [];
    let enModoEstribillo = false;

    const limpiar = arr => arr.join('\n').replace(/<[^>]*>/g, '').trim();

    lineas.forEach(linea => {
      const limpiaParaAcorde = linea.replace(/<[^>]*>/g, '').trim();

      // Ignorar líneas de acordes
      if (isChordLine(limpiaParaAcorde)) return;

      const esVacia = limpiaParaAcorde === '';
      const detectaInicioB = /<b>/i.test(linea);
      const detectaFinB = /<\/b>/i.test(linea);

      // REGLA 1: <b> cierra lo anterior y abre estribillo
      if (detectaInicioB) {
        if (bloqueActual.length > 0) {
          bloques.push({ texto: limpiar(bloqueActual), esEstribillo: false });
        }
        bloqueActual = [linea];
        enModoEstribillo = true;

        // Estribillo de una sola línea (</b> en la misma línea)
        if (detectaFinB) {
          bloques.push({ texto: limpiar(bloqueActual), esEstribillo: true });
          bloqueActual = [];
          enModoEstribillo = false;
        }
        return;
      }

      // REGLA 2: </b> cierra el estribillo
      if (detectaFinB) {
        bloqueActual.push(linea);
        bloques.push({ texto: limpiar(bloqueActual), esEstribillo: true });
        bloqueActual = [];
        enModoEstribillo = false;
        return;
      }

      // REGLA 3: línea en blanco separa estrofas normales
      if (esVacia && !enModoEstribillo) {
        if (bloqueActual.length > 0) {
          bloques.push({ texto: limpiar(bloqueActual), esEstribillo: false });
          bloqueActual = [];
        }
        return;
      }

      // Acumulación normal
      if (!esVacia || enModoEstribillo) {
        bloqueActual.push(linea);
      }
    });

    // Bloque residual
    if (bloqueActual.length > 0) {
      bloques.push({ texto: limpiar(bloqueActual), esEstribillo: enModoEstribillo });
    }

    // Descartar bloques que quedaron sin texto
    bloques = bloques.filter(b => b.texto !== '');
    if (bloques.length === 0) return [];

    const salida = [{ tipo: 'titulo', contenido: titulo }];

    // Intercalado de un único estribillo entre estrofas
    const estribillos = bloques.filter(b => b.esEstribillo);
    const soloEstrofas = bloques.filter(b => !b.esEstribillo);

    if (estribillos.length === 1 && soloEstrofas.length > 0) {
      const coro = estribillos[0];
      const empiezaConCoro = bloques[0].esEstribillo;

      if (empiezaConCoro) {
        soloEstrofas.forEach(estrofa => {
          salida.push({ tipo: 'estrofa', texto: coro.texto, esEstribillo: true });
          salida.push({ tipo: 'estrofa', texto: estrofa.texto, esEstribillo: false });
        });
        salida.push({ tipo: 'estrofa', texto: coro.texto, esEstribillo: true });
      } else {
        soloEstrofas.forEach(estrofa => {
          salida.push({ tipo: 'estrofa', texto: estrofa.texto, esEstribillo: false });
          salida.push({ tipo: 'estrofa', texto: coro.texto, esEstribillo: true });
        });
      }
    } else {
      bloques.forEach(b => salida.push({ tipo: 'estrofa', texto: b.texto, esEstribillo: b.esEstribillo }));
    }

    return salida;
  } catch (err) {
    console.error('Error procesando', item && item.cancion, err);
    return [];
  }
}

// Carga todas las canciones en paralelo (conservando el orden del programa).
// Devuelve [] si no hay ninguna letra utilizable.
async function cargarTodoElPrograma(programa) {
  const porCancion = await Promise.all(programa.map(procesarCancion));
  const todas = porCancion.flat();
  if (todas.length === 0) return [];
  todas.push({ tipo: 'fin' });   // diapositiva en blanco al final
  return todas;
}

/* =====================================================================
   DIVISIÓN DE ESTROFAS LARGAS (modo por estrofa)
   ===================================================================== */
// Reparte un arreglo de líneas en partes parejas, de a MAX_LINEAS_POR_SLIDE como máximo
function repartirLineas(lineas) {
  if (lineas.length <= MAX_LINEAS_POR_SLIDE) return [lineas.join('\n')];
  const partes = Math.ceil(lineas.length / MAX_LINEAS_POR_SLIDE);
  const tam = Math.ceil(lineas.length / partes);
  const salida = [];
  for (let i = 0; i < lineas.length; i += tam) {
    salida.push(lineas.slice(i, i + tam).join('\n'));
  }
  return salida;
}

function dividirTexto(texto) {
  const lineas = texto.split('\n');
  if (lineas.length <= MAX_LINEAS_POR_SLIDE) return [texto];

  // Primero se respetan los cortes naturales (líneas en blanco dentro del bloque)
  const grupos = texto.split(/\n\s*\n/).map(g => g.trim()).filter(Boolean);
  const partes = [];
  grupos.forEach(g => partes.push(...repartirLineas(g.split('\n'))));
  return partes;
}

function expandirSlides(lista) {
  const salida = [];
  lista.forEach(d => {
    if (d.tipo === 'estrofa') {
      dividirTexto(d.texto).forEach(parte => salida.push({ ...d, texto: parte }));
    } else {
      salida.push(d);
    }
  });
  return salida;
}

/* =====================================================================
   VISUALIZACIÓN
   ===================================================================== */
function htmlDeSlide(d) {
  if (d.tipo === 'titulo') {
    return `<h2 class="titulo-cancion">${escaparHtml(d.contenido)}</h2>`;
  }
  if (d.tipo === 'fin') {
    return '';
  }
  const texto = d.texto.replace(/\n/g, '<br>');
  if (d.tipo === 'oracion-estrofa') {
    return `<div class="bloque-oracion">${texto}</div>`;
  }
  const clase = d.esEstribillo ? 'bloque estribillo-destacado' : 'bloque';
  return `<div class="${clase}">${texto}</div>`;
}

// Si el contenido no cabe en pantalla, reduce el texto de a poco (hasta AJUSTE_MIN)
function ajustarAlto() {
  let factor = 1;
  pantalla.style.setProperty('--ajuste', factor);
  const contenido = pantalla.firstElementChild;
  if (!contenido) return;

  const disponible = window.innerHeight * 0.90; // descuenta el padding de 5vh arriba y abajo
  while (contenido.getBoundingClientRect().height > disponible && factor > AJUSTE_MIN) {
    factor = Math.round((factor - 0.05) * 100) / 100;
    pantalla.style.setProperty('--ajuste', factor);
  }
}

function renderizarSlide(conFade = true) {
  const d = slides[indiceActual];
  if (!d) return;

  const aplicar = () => {
    pantalla.innerHTML = htmlDeSlide(d);
    ajustarAlto();
    pantalla.classList.remove('fade-out');
  };

  clearTimeout(timerFade);
  if (!conFade) {
    aplicar();
    return;
  }
  pantalla.classList.add('fade-out');
  timerFade = setTimeout(aplicar, 200); // coincide con la transición CSS
}

/* =====================================================================
   MODOS DE PROYECCIÓN
   ===================================================================== */
async function iniciar(tipoModo) {
  if (cargando) return;
  cargando = true;
  setBotonesProyeccion(false);
  mostrarEstado('Cargando letras…');

  try {
    diapositivas = await cargarTodoElPrograma(leerPrograma());

    if (diapositivas.length === 0) {
      mostrarEstado('No hay letras para proyectar. Crea un programa y vuelve a intentarlo.');
      return;
    }

    mostrarEstado('');
    $('configuracion').style.display = 'none';
    indiceActual = 0;
    modo = tipoModo;

    if (tipoModo === 'estrofa') {
      slides = expandirSlides(diapositivas);
      pantalla.className = 'modo-estrofa';
      renderizarSlide(false);
    } else {
      pantalla.className = 'modo-continuo';
      pantalla.style.setProperty('--ajuste', 1);
      pantalla.innerHTML = htmlContinuo();
      window.scrollTo(0, 0);
    }
  } catch (err) {
    console.error(err);
    mostrarEstado('No se pudo cargar el programa.');
  } finally {
    cargando = false;
    setBotonesProyeccion(true);
  }
}

function htmlContinuo() {
  let html = '';
  diapositivas.forEach(d => {
    if (d.tipo === 'titulo' || d.tipo === 'estrofa' || d.tipo === 'oracion-estrofa') {
      html += htmlDeSlide(d);
    }
    // 'fin' se ignora en modo continuo
  });
  return html;
}

/* =====================================================================
   NAVEGACIÓN (sólo modo por estrofa)
   ===================================================================== */
function avanzar() {
  if (indiceActual < slides.length - 1) {
    indiceActual++;
    renderizarSlide();
  } else if (confirm('¿Finalizar proyección y volver al menú?')) {
    location.reload();
  }
}

function retroceder() {
  if (indiceActual > 0) {
    indiceActual--;
    renderizarSlide();
  }
}

window.addEventListener('keydown', e => {
  if (!modo) return;

  // Esc vuelve al menú en cualquier modo
  if (e.key === 'Escape') {
    location.reload();
    return;
  }

  // En modo continuo no se toca nada: el teclado desplaza la página normalmente
  if (modo !== 'estrofa') return;

  if (['ArrowRight', 'PageDown', 'Enter', ' '].includes(e.key)) {
    e.preventDefault();
    if (!e.repeat) avanzar();
  } else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) {
    e.preventDefault();
    if (!e.repeat) retroceder();
  }
});

// Clic / toque: primer tercio retrocede, el resto avanza. Sólo en modo por estrofa.
pantalla.addEventListener('click', e => {
  if (modo !== 'estrofa') return;
  if (e.clientX < window.innerWidth / 3) retroceder();
  else avanzar();
});
pantalla.addEventListener('contextmenu', e => e.preventDefault());

$('btn-continuo').addEventListener('click', () => iniciar('continuo'));
$('btn-estrofa').addEventListener('click', () => iniciar('estrofa'));

/* =====================================================================
   COLORES
   ===================================================================== */
function setColors(bg, text) {
  document.documentElement.style.setProperty('--bg-color', bg);
  document.documentElement.style.setProperty('--text-color', text);
  $('bgColor').value = bg;
  $('textColor').value = text;
}

document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => setColors(...PRESETS[btn.dataset.preset]));
});

$('bgColor').addEventListener('input', e => {
  document.documentElement.style.setProperty('--bg-color', e.target.value);
});
$('textColor').addEventListener('input', e => {
  document.documentElement.style.setProperty('--text-color', e.target.value);
});

setColors(...PRESETS.dia1); // sincroniza los selectores con los colores reales

/* =====================================================================
   TAMAÑO DEL TEXTO
   ===================================================================== */
function aplicarFontSize() {
  document.documentElement.style.setProperty('--font-size', fontSize + 'vh');
}

function cambiarTexto(delta) {
  fontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSize + delta));
  aplicarFontSize();
  try { localStorage.setItem('proyectorFontSize', String(fontSize)); } catch (err) { /* ignorar */ }
  if (modo === 'estrofa') ajustarAlto();
}

$('btn-mas').addEventListener('click', () => cambiarTexto(FONT_PASO));
$('btn-menos').addEventListener('click', () => cambiarTexto(-FONT_PASO));

// Recuperar el último tamaño usado
try {
  const guardado = parseFloat(localStorage.getItem('proyectorFontSize'));
  if (!isNaN(guardado)) fontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, guardado));
} catch (err) { /* ignorar */ }
aplicarFontSize();
</script>
</body>
</html>
